[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gateway-llm"
version = "0.1.0"
description = "Quality-Gated Batch Router : routage LLM par cascade, guardrails, budget et résidence des données."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Amandine Dennieau", email = "dennieau.amandine@proton.me" }]
keywords = ["llm", "router", "batch", "guardrails", "fallback", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ─── Tout ce qu'il faut à un utilisateur final ────────────────
dependencies = [
    # Base
    "requests>=2.32",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Détection d'hallucinations (pilier du projet, PAS optionnel)
    "nemoguardrails>=0.11",
    # Parsing HTML pour intake from-urls
    "beautifulsoup4>=4.12",
    # Backends de secrets cloud (installés par défaut, sélection au runtime)
    "boto3>=1.34",                        # AWS Secrets Manager
    "azure-identity>=1.15",               # Azure Key Vault
    "azure-keyvault-secrets>=4.9",
]

# ─── Réservé aux développeurs qui contribuent au code ────────
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
gateway-llm = "gateway_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_llm"]

# ────────────────────────────────────────────────────────────────
# Ruff — lint + format
# ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "S110", "B017", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]

# ────────────────────────────────────────────────────────────────
# Bandit — analyse statique de sécurité
# ────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B404", "B603", "B607", "B110"]

# ────────────────────────────────────────────────────────────────
# Pytest
# ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

# ────────────────────────────────────────────────────────────────
# Coverage
# ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/gateway_llm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ────────────────────────────────────────────────────────────────
# Mypy
# ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true